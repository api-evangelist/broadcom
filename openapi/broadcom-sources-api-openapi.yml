openapi: 3.2.0
info:
  title: Broadcom Operations for Applications REST Sources API
  description: The VMware Aria Operations for Applications REST API (formerly Tanzu Observability by Wavefront) enables programmatic interaction with the observability service. It supports querying metrics, managing dashboards, alerts, events, sources, user accounts, API tokens, and ingesting data directly. The API uses JSON payloads over HTTPS and supports both API token and session-based authentication.
  version: 2.0.0
  contact:
    name: Broadcom Developer Support
    url: https://developer.broadcom.com
  license:
    name: Proprietary
    url: https://www.broadcom.com/company/legal/licensing
servers:
- url: https://{instance}.wavefront.com/api/v2
  description: Operations for Applications instance
  variables:
    instance:
      default: example
      description: Your Operations for Applications instance name
security:
- bearerAuth: []
tags:
- name: Sources
  description: Source management
paths:
  /source:
    get:
      summary: Broadcom List sources
      description: Returns all sources.
      operationId: listSources
      tags:
      - Sources
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
  /source/{id}:
    get:
      summary: Broadcom Get a source
      description: Returns the specified source.
      operationId: getSource
      tags:
      - Sources
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
components:
  schemas:
    Source:
      type: object
      properties:
        id:
          type: string
        sourceName:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        description:
          type: string
    SourceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Source'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token for authentication
externalDocs:
  description: Operations for Applications REST API Documentation
  url: https://developer.broadcom.com/xapis/operations-for-applications-rest-api/latest/
