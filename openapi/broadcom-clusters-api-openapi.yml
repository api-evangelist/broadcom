openapi: 3.2.0
info:
  title: Broadcom Clusters API
  contact:
    name: Broadcom Developer Support
    url: https://developer.broadcom.com
  license:
    name: Proprietary
    url: https://www.broadcom.com/company/legal/licensing
  version: '1.0'
  description: 'Operations tagged Clusters across 2 of this provider''s published API definitions: broadcom-vmware-cloud-foundation-openapi.yml, broadcom-vsphere-automation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{sddc-manager}/v1
  description: SDDC Manager instance
  variables:
    sddc-manager:
      default: sddc-manager.example.com
      description: The hostname of the SDDC Manager
- url: https://{vcenter}/api
  description: vCenter Server instance
  variables:
    vcenter:
      default: vcenter.example.com
      description: The hostname or IP address of the vCenter Server
tags:
- name: Clusters
  description: Cluster management
paths:
  /clusters:
    get:
      summary: Broadcom List clusters
      description: Returns all clusters.
      operationId: listClusters
      tags:
      - Clusters
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
      security:
      - bearerAuth: []
    servers:
    - url: https://{sddc-manager}/v1
      description: SDDC Manager instance
      variables:
        sddc-manager:
          default: sddc-manager.example.com
          description: The hostname of the SDDC Manager
  /clusters/{id}:
    get:
      summary: Broadcom Get cluster details
      description: Returns details of the specified cluster.
      operationId: getCluster
      tags:
      - Clusters
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
      security:
      - bearerAuth: []
    patch:
      summary: Broadcom Update a cluster
      description: Updates the specified cluster configuration, such as expanding or shrinking.
      operationId: updateCluster
      tags:
      - Clusters
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdateSpec'
      responses:
        '202':
          description: Cluster update started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      security:
      - bearerAuth: []
    servers:
    - url: https://{sddc-manager}/v1
      description: SDDC Manager instance
      variables:
        sddc-manager:
          default: sddc-manager.example.com
          description: The hostname of the SDDC Manager
  /vcenter/cluster:
    get:
      summary: Broadcom List clusters
      description: Returns information about clusters in the vCenter Server.
      operationId: listClusters
      tags:
      - Clusters
      parameters:
      - name: filter.names
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterSummary'
      security:
      - sessionAuth: []
    servers:
    - url: https://{vcenter}/api
      description: vCenter Server instance
      variables:
        vcenter:
          default: vcenter.example.com
          description: The hostname or IP address of the vCenter Server
components:
  schemas:
    Host:
      type: object
      properties:
        id:
          type: string
        fqdn:
          type: string
        ipAddress:
          type: string
        status:
          type: string
          enum:
          - ASSIGNED
          - UNASSIGNED
          - DECOMMISSIONED
        domain:
          type: object
          properties:
            id:
              type: string
        cluster:
          type: object
          properties:
            id:
              type: string
    Task:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - IN_PROGRESS
          - SUCCESSFUL
          - FAILED
          - CANCELLED
        type:
          type: string
        creationTimestamp:
          type: string
          format: date-time
        completionTimestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
    HostCommissionSpec:
      type: object
      required:
      - fqdn
      - username
      - password
      - networkPoolId
      - storageType
      properties:
        fqdn:
          type: string
        username:
          type: string
        password:
          type: string
        networkPoolId:
          type: string
        storageType:
          type: string
          enum:
          - VSAN
          - NFS
          - VMFS_FC
    ClusterList:
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
    ClusterUpdateSpec:
      type: object
      properties:
        hostSpecs:
          type: array
          items:
            $ref: '#/components/schemas/HostCommissionSpec'
        clusterExpansionSpec:
          type: object
    Cluster:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        primaryDatastoreType:
          type: string
        isDefault:
          type: boolean
        isStretched:
          type: boolean
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/Host'
    ClusterSummary:
      type: object
      properties:
        cluster:
          type: string
        name:
          type: string
        ha_enabled:
          type: boolean
        drs_enabled:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token obtained via POST /tokens
    basicAuth:
      type: http
      scheme: basic
    sessionAuth:
      type: apiKey
      in: header
      name: vmware-api-session-id
      description: Session token obtained via POST /cis/session
x-refined-from:
- broadcom-vmware-cloud-foundation-openapi.yml
- broadcom-vsphere-automation-openapi.yml
