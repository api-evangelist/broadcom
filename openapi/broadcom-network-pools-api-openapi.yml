openapi: 3.2.0
info:
  title: Broadcom VMware Cloud Foundation Network Pools API
  description: The VMware Cloud Foundation API provides RESTful endpoints for managing SDDC (Software-Defined Data Center) infrastructure through the SDDC Manager. It enables automation of host commissioning, cluster management, workload domain lifecycle, network pool configuration, task monitoring, and VCF management component deployments. The API supports both Basic and Bearer token authentication over HTTPS with JSON payloads.
  version: 9.0.0
  contact:
    name: Broadcom Developer Support
    url: https://developer.broadcom.com
  license:
    name: Proprietary
    url: https://www.broadcom.com/company/legal/licensing
servers:
- url: https://{sddc-manager}/v1
  description: SDDC Manager instance
  variables:
    sddc-manager:
      default: sddc-manager.example.com
      description: The hostname of the SDDC Manager
security:
- bearerAuth: []
tags:
- name: Network Pools
  description: Network pool management
paths:
  /network-pools:
    get:
      summary: Broadcom List network pools
      description: Returns all network pools.
      operationId: listNetworkPools
      tags:
      - Network Pools
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkPoolList'
    post:
      summary: Broadcom Create a network pool
      description: Creates a new network pool.
      operationId: createNetworkPool
      tags:
      - Network Pools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkPool'
      responses:
        '201':
          description: Network pool created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkPool'
components:
  schemas:
    NetworkPoolList:
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/NetworkPool'
    NetworkPool:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        networks:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              vlanId:
                type: integer
              subnet:
                type: string
              gateway:
                type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token obtained via POST /tokens
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: VMware Cloud Foundation API Reference
  url: https://developer.broadcom.com/xapis/sddc-manager-api/latest/
