openapi: 3.2.0
info:
  title: Broadcom Hosts API
  contact:
    name: Broadcom Developer Support
    url: https://developer.broadcom.com
  license:
    name: Proprietary
    url: https://www.broadcom.com/company/legal/licensing
  version: '1.0'
  description: 'Operations tagged Hosts across 2 of this provider''s published API definitions: broadcom-vmware-cloud-foundation-openapi.yml, broadcom-vsphere-automation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{sddc-manager}/v1
  description: SDDC Manager instance
  variables:
    sddc-manager:
      default: sddc-manager.example.com
      description: The hostname of the SDDC Manager
- url: https://{vcenter}/api
  description: vCenter Server instance
  variables:
    vcenter:
      default: vcenter.example.com
      description: The hostname or IP address of the vCenter Server
tags:
- name: Hosts
  description: ESXi host management
paths:
  /hosts:
    get:
      summary: Broadcom List hosts
      description: Returns all commissioned hosts.
      operationId: listHosts
      tags:
      - Hosts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostList'
      security:
      - bearerAuth: []
    post:
      summary: Broadcom Commission hosts
      description: Commissions one or more hosts for use in VCF.
      operationId: commissionHosts
      tags:
      - Hosts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/HostCommissionSpec'
      responses:
        '202':
          description: Host commissioning started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      security:
      - bearerAuth: []
    servers:
    - url: https://{sddc-manager}/v1
      description: SDDC Manager instance
      variables:
        sddc-manager:
          default: sddc-manager.example.com
          description: The hostname of the SDDC Manager
  /hosts/{id}:
    get:
      summary: Broadcom Get host details
      description: Returns details of the specified host.
      operationId: getHost
      tags:
      - Hosts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '404':
          description: Host not found
      security:
      - bearerAuth: []
    servers:
    - url: https://{sddc-manager}/v1
      description: SDDC Manager instance
      variables:
        sddc-manager:
          default: sddc-manager.example.com
          description: The hostname of the SDDC Manager
  /vcenter/host:
    get:
      summary: Broadcom List hosts
      description: Returns information about hosts in the vCenter Server.
      operationId: listHosts
      tags:
      - Hosts
      parameters:
      - name: filter.names
        in: query
        schema:
          type: array
          items:
            type: string
      - name: filter.connection_states
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - CONNECTED
            - DISCONNECTED
            - NOT_RESPONDING
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HostSummary'
      security:
      - sessionAuth: []
    servers:
    - url: https://{vcenter}/api
      description: vCenter Server instance
      variables:
        vcenter:
          default: vcenter.example.com
          description: The hostname or IP address of the vCenter Server
components:
  schemas:
    Host:
      type: object
      properties:
        id:
          type: string
        fqdn:
          type: string
        ipAddress:
          type: string
        status:
          type: string
          enum:
          - ASSIGNED
          - UNASSIGNED
          - DECOMMISSIONED
        domain:
          type: object
          properties:
            id:
              type: string
        cluster:
          type: object
          properties:
            id:
              type: string
    HostCommissionSpec:
      type: object
      required:
      - fqdn
      - username
      - password
      - networkPoolId
      - storageType
      properties:
        fqdn:
          type: string
        username:
          type: string
        password:
          type: string
        networkPoolId:
          type: string
        storageType:
          type: string
          enum:
          - VSAN
          - NFS
          - VMFS_FC
    HostList:
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Host'
    Task:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - IN_PROGRESS
          - SUCCESSFUL
          - FAILED
          - CANCELLED
        type:
          type: string
        creationTimestamp:
          type: string
          format: date-time
        completionTimestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
    HostSummary:
      type: object
      properties:
        host:
          type: string
        name:
          type: string
        connection_state:
          type: string
          enum:
          - CONNECTED
          - DISCONNECTED
          - NOT_RESPONDING
        power_state:
          type: string
          enum:
          - POWERED_ON
          - POWERED_OFF
          - STANDBY
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token obtained via POST /tokens
    basicAuth:
      type: http
      scheme: basic
    sessionAuth:
      type: apiKey
      in: header
      name: vmware-api-session-id
      description: Session token obtained via POST /cis/session
x-refined-from:
- broadcom-vmware-cloud-foundation-openapi.yml
- broadcom-vsphere-automation-openapi.yml
